<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>n-Queens Problem - SAT Solver Visualization</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>n-Queens Solver</h1>
            <p>SAT solver with DIMACS formula visualization</p>
        </header>

        <div class="content">
            <!-- Left Panel: DIMACS Formula -->
            <div class="section">
                <h2>DIMACS Formula</h2>
                <div class="controls">
                    <label for="board-size">Size:</label>
                    <select id="board-size"></select>
                    <button onclick="solve()">Solve</button>
                </div>

                <div class="loading" id="formula-loading">
                    <span class="spinner"></span>Loading...
                </div>

                <div class="formula-display" id="formula-display">
                    <div class="empty-state">
                        Select a size and click Load
                    </div>
                </div>

                <div class="message" id="formula-message"></div>
            </div>

            <!-- Right Panel: Chessboard -->
            <div class="section">
                <h2>Solution</h2>

                <div class="loading" id="solve-loading">
                    <span class="spinner"></span>Solving...
                </div>

                <div id="board-container" style="display: none;">
                    <div class="chessboard" id="chessboard"></div>
                </div>

                <div class="empty-state" id="board-empty">
                </div>

                <div class="message" id="solve-message"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
